<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in Transit | Stackly</title>
  <meta name="description" content="This page missed its flight. Let's get you back on route.">

  <link rel="icon" type="image/svg+xml" href="svg/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="nf-body">

  <!-- Drifting clouds -->
  <span class="nf-cloud"
        style="top:14%;width:130px;height:38px;animation-duration:38s">
  </span>

  <span class="nf-cloud"
        style="top:38%;width:90px;height:28px;animation-duration:52s;animation-delay:-18s">
  </span>

  <span class="nf-cloud"
        style="top:66%;width:160px;height:44px;animation-duration:44s;animation-delay:-30s">
  </span>

  <span class="nf-cloud"
        style="top:82%;width:100px;height:30px;animation-duration:60s;animation-delay:-8s">
  </span>


  <!-- Flying plane -->
  <svg class="nf-plane"
       viewBox="0 0 24 24"
       aria-hidden="true">

    <path
      fill="currentColor"
      d="M21.5 15.5v-2l-8.5-5V3.2a1.2 1.2 0 0 0-2.4 0v5.3l-8.5 5v2l8.5-2.6v5.6L8.3 20v1.5l3.5-1 3.5 1V20l-2.3-1.5v-5.6l8.5 2.6z">
    </path>

  </svg>


  <div class="nf-box">

    <!-- Brand -->
    <a href="index.html"
       class="brand"
       style="justify-content:center;display:inline-flex">

      <img src="svg/logo.svg" alt="Stackly">

      <span>
        Stackly
        <small>Travel Booking Platform</small>
      </span>

    </a>


    <!-- 404 -->
    <div>
      <span class="nf-code">
        4<span class="zero">0</span>4
      </span>
    </div>


    <div class="script" style="font-size:1.8rem">
      Well, this is awkward…
    </div>


    <h1>This page missed its flight</h1>


    <p>
      The route you're looking for doesn't exist, was rebooked,
      or never boarded. Let's get you back to somewhere wonderful.
    </p>


    <!-- ACTION BUTTONS -->
    <div class="actions">

      <!-- GO BACK TO PREVIOUS PAGE + PREVIOUS SECTION -->
      <button
        type="button"
        class="btn btn-primary"
        id="goBackBtn">

        Go Back

        <svg aria-hidden="true">
          <use href="svg/sprite.svg#i-arrow"></use>
        </svg>

      </button>


      <!-- HOME -->
      <a
        href="index.html"
        class="btn btn-ghost">

        Back to Home

      </a>

    </div>

  </div>


  <script>

    /*
      ============================================
      GO BACK BUTTON
      ============================================

      history.back() returns the visitor to the
      exact previous URL.

      If the previous page contained a hash/section,
      browser history keeps that location.

      Example:

      index.html#services
      about.html#team
      service.html#pricing

      The browser will return to that location.
    */

    document
      .getElementById('goBackBtn')
      .addEventListener('click', function () {

        /*
          Check whether there is actually a previous
          page in browser history.
        */

        if (window.history.length > 1) {

          window.history.back();

        } else {

          /*
            If the user opened the 404 page directly
            and there is no previous page, send them
            safely to the homepage.
          */

          window.location.href = 'index.html';

        }

      });


    /*
      ============================================
      GENTLE WOBBLE ON 404 DIGITS
      ============================================
    */

    (function () {

      var code = document.querySelector('.nf-code');

      var t = 0;

      function wobble() {

        t += 0.02;

        code.style.transform =
          'translateY(' +
          Math.sin(t) * 8 +
          'px)';

        requestAnimationFrame(wobble);

      }

      wobble();

    })();

  </script>


  <script src="js/icon-fallback.js"></script>

</body>
</html>
